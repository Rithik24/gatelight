<title>Gatelight Camera</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: one-screen camera — readout bar, viewfinder, film-stock strip, one adjust slider, shutter bar. Single dark look on purpose (darkroom). */
:root{
  color-scheme: dark;
  --bg:#0f0d0c;          /* darkroom black, warm bias */
  --panel:#1a1614;
  --line:#2e2724;
  --fg:#efe6db;
  --muted:#968a7f;
  --amber:#e6a85a;       /* tungsten safelight */
  --amber-ink:#1a1209;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--display);overflow:hidden}
.app{height:100%;max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:10px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:10px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px}
.mark{font-weight:700;font-size:20px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.mark i{width:10px;height:10px;border-radius:50%;background:var(--amber);box-shadow:0 0 12px var(--amber);display:inline-block}
.readout{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.readout b{color:var(--fg);font-weight:600}
button,.btn{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,.btn:focus-within,input:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.aspect{font-family:var(--mono);font-size:11px;border:1px solid var(--line);border-radius:4px;padding:4px 8px;color:var(--fg);letter-spacing:.06em}

.stage{position:relative;flex:1 1 auto;min-height:180px;background:#000;border-radius:6px;overflow:hidden;touch-action:none}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.tag{position:absolute;left:10px;top:10px;font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;background:rgba(15,13,12,.72);color:var(--fg);padding:5px 8px;border-radius:3px}
.tag.right{top:auto;bottom:10px;color:var(--amber)}
.busy{position:absolute;inset:0;display:grid;place-items:center;background:rgba(15,13,12,.55);font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase}

.stocks{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.stocks::-webkit-scrollbar{display:none}
.stock{flex:0 0 auto;text-align:left;border:1px solid var(--line);border-radius:6px;padding:8px 10px;min-width:112px;background:var(--panel)}
.stock .n{font-weight:700;font-size:14px;display:block}
.stock .d{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.04em}
.stock[aria-pressed="true"]{border-color:var(--amber);background:var(--amber);color:var(--amber-ink)}
.stock[aria-pressed="true"] .d{color:var(--amber-ink);opacity:.75}

.adjust{display:flex;flex-direction:column;gap:8px}
.params{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.params::-webkit-scrollbar{display:none}
.param{flex:1 0 auto;font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:6px 6px;border-radius:4px;display:flex;flex-direction:column;align-items:center;gap:2px}
.param span{font-size:12px;color:var(--fg);font-variant-numeric:tabular-nums}
.param[aria-pressed="true"]{background:var(--panel);color:var(--amber)}
input[type=range]{width:100%;accent-color:var(--amber);height:28px}

.bar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding-bottom:4px}
.side{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:10px 12px;border:1px solid var(--line);border-radius:6px;display:inline-flex;align-items:center;justify-content:center;gap:6px;position:relative}
.side input,.shutter input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.bar .left{justify-self:start}.bar .right{justify-self:end}
.side.save{background:var(--fg);color:var(--bg);border-color:var(--fg);font-weight:600}
.shutter{position:relative;width:72px;height:72px;border-radius:50%;border:3px solid var(--fg);display:grid;place-items:center}
.shutter::after{content:"";width:56px;height:56px;border-radius:50%;background:var(--amber);transition:transform .12s}
.shutter:active::after{transform:scale(.9)}
.compare{position:absolute;right:10px;bottom:10px;font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;background:rgba(15,13,12,.72);padding:7px 10px;border-radius:3px;user-select:none;-webkit-user-select:none}

.sheet{position:fixed;inset:0;background:rgba(10,8,7,.94);display:flex;flex-direction:column;gap:12px;align-items:center;justify-content:center;z-index:20;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:calc(16px + env(safe-area-inset-top, 0px)) calc(16px + env(safe-area-inset-bottom, 0px))}
.sheet img{max-height:70%;max-width:100%;border-radius:4px}
.sheet p{max-width:36ch;text-align:center;color:var(--muted);font-size:14px;line-height:1.5;margin:0}
.toast{position:fixed;left:50%;bottom:calc(110px + env(safe-area-inset-bottom, 0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);font-family:var(--mono);font-size:12px;padding:8px 12px;border-radius:4px;z-index:30}
@media (prefers-reduced-motion: reduce){.shutter::after{transition:none}}
</style>

<div class="app">
  <header>
    <div class="mark"><i></i>Gatelight</div>
    <div class="readout">
      <span id="ro-stock"><b>Tungsten 500</b></span>
      <span id="ro-ev">±0.0 EV</span>
      <button class="aspect" id="aspect" aria-label="Change frame shape">3:2</button>
    </div>
  </header>

  <div class="stage" id="stage">
    <canvas id="view" aria-label="Developed photo"></canvas>
    <div class="tag" id="srcTag">Sample scene · tap the shutter to shoot</div>
    <div class="tag right" id="dimTag"></div>
    <div class="compare" id="compare">Hold: original</div>
    <div class="busy" id="busy" hidden>Developing…</div>
  </div>

  <div class="stocks" id="stocks" role="group" aria-label="Film stock"></div>

  <div class="adjust">
    <div class="params" id="params" role="group" aria-label="Adjustment"></div>
    <input type="range" id="slider" aria-label="Adjustment amount">
  </div>

  <div class="bar">
    <label class="side left btn">Gallery<input type="file" id="pick" accept="image/*"></label>
    <label class="shutter btn" aria-label="Take a photo"><input type="file" id="cam" accept="image/*" capture="environment"></label>
    <button class="side save right" id="save">Save</button>
  </div>
</div>

<div class="sheet" id="sheet" hidden>
  <img id="sheetImg" alt="Developed photo, full size">
  <p>Press and hold the photo, then choose <b>Download image</b> to keep it in your gallery.</p>
  <button class="side" id="sheetClose">Done</button>
</div>
<div class="toast" id="toast" hidden></div>

<script>
(() => {
const $ = s => document.querySelector(s);

/* ---------- film stocks (original looks) ---------- */
const STOCKS = [
  { name:"Tungsten 500", d:"Night · interiors", m:[1.06,-0.04,-0.02, -0.03,1.05,-0.02, 0.00,-0.07,1.07],
    sat:0.9, con:0.34, black:0.04, white:0.965, sh:[-0.022,0.008,0.038], hi:[0.035,0.012,-0.028], halo:65, grain:45, vig:0.28 },
  { name:"Daylight 250", d:"Sun · skin tones", m:[1.04,-0.02,-0.02, -0.02,1.03,-0.01, -0.01,-0.04,1.05],
    sat:1.0, con:0.26, black:0.03, white:0.97, sh:[0.006,0.004,0.018], hi:[0.03,0.016,-0.02], halo:40, grain:30, vig:0.22 },
  { name:"Silver Retain", d:"Hard · muted", m:[1.02,-0.01,-0.01, -0.01,1.02,-0.01, -0.01,-0.02,1.03],
    sat:0.52, con:0.58, black:0.025, white:0.975, sh:[-0.01,0.004,0.016], hi:[0.012,0.008,-0.004], halo:25, grain:55, vig:0.32 },
  { name:"Studio 50", d:"Clean · fine grain", m:[1.03,-0.02,-0.01, -0.01,1.02,-0.01, 0,-0.02,1.02],
    sat:1.04, con:0.18, black:0.02, white:0.98, sh:[0,0.004,0.01], hi:[0.012,0.006,-0.008], halo:20, grain:12, vig:0.14 },
  { name:"Mono 400", d:"Black & white", mono:[0.42,0.46,0.12], m:[1,0,0, 0,1,0, 0,0,1],
    sat:0, con:0.46, black:0.035, white:0.97, sh:[0.004,0.002,-0.004], hi:[0.012,0.006,-0.006], halo:30, grain:60, vig:0.3 },
];
const ASPECTS = [["3:2",1.5],["1.85",1.85],["2.39",2.39],["1:1",1],["Full",0]];

const state = { stock:0, strength:100, grain:STOCKS[0].grain, halo:STOCKS[0].halo, warmth:0, ev:0, aspect:0 };
const PARAMS = [
  { k:"strength", label:"Strength", min:0, max:100, step:1, fmt:v=>v+"%" },
  { k:"grain", label:"Grain", min:0, max:100, step:1, fmt:v=>String(v) },
  { k:"halo", label:"Halation", min:0, max:100, step:1, fmt:v=>String(v) },
  { k:"warmth", label:"Warmth", min:-50, max:50, step:1, fmt:v=>(v>0?"+":"")+v },
  { k:"ev", label:"Exposure", min:-2, max:2, step:0.1, fmt:v=>(v>0?"+":v<0?"−":"±")+Math.abs(v).toFixed(1) },
];
let activeParam = 0;

/* ---------- lookup tables ---------- */
const S2L = new Float32Array(256);
for (let i=0;i<256;i++){ const v=i/255; S2L[i] = v<=0.04045 ? v/12.92 : Math.pow((v+0.055)/1.055,2.4); }
const L2S = new Float32Array(4096);
for (let i=0;i<4096;i++){ const v=i/4095; L2S[i] = v<=0.0031308 ? v*12.92 : 1.055*Math.pow(v,1/2.4)-0.055; }
function buildCurve(s){
  const c = new Float32Array(1024), g = 1 + s.con*1.6;
  for (let i=0;i<1024;i++){
    const v=i/1023;
    const base = v<0.5 ? 0.5*Math.pow(2*v,g) : 1-0.5*Math.pow(2*(1-v),g);
    c[i] = s.black + (s.white - s.black)*base;
  }
  return c;
}
const shoulder = x => x<=0.7 ? x : 0.7 + 0.3*(1-Math.exp(-(x-0.7)/0.3));

/* ---------- helpers ---------- */
function mk(w,h){ const c=document.createElement("canvas"); c.width=w; c.height=h; return {c, x:c.getContext("2d",{willReadFrequently:true})}; }
function mulberry(a){ return () => { a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }

function cropRect(sw, sh){
  const r0 = ASPECTS[state.aspect][1];
  if (!r0) return [0,0,sw,sh];
  const r = (sh>sw && r0!==1) ? 1/r0 : r0;
  let cw=sw, ch=sw/r;
  if (ch>sh){ ch=sh; cw=sh*r; }
  return [(sw-cw)/2,(sh-ch)/2,cw,ch];
}

function prepare(src, maxEdge){
  const sw = src.naturalWidth||src.width, sh = src.naturalHeight||src.height;
  const [sx,sy,cw,ch] = cropRect(sw,sh);
  const sc = Math.min(1, maxEdge/Math.max(cw,ch));
  const w = Math.max(1,Math.round(cw*sc)), h = Math.max(1,Math.round(ch*sc));
  const k = mk(w,h);
  k.x.imageSmoothingQuality = "high";
  k.x.drawImage(src,sx,sy,cw,ch,0,0,w,h);
  return { ...k, w, h, data:k.x.getImageData(0,0,w,h), halo:haloMap(k.c,w,h), noise:noiseMap(w,h) };
}

/* glow map from the brightest parts of the frame, blurred wide */
function haloMap(c,w,h){
  const sw=Math.max(8,Math.round(w/8)), sh=Math.max(8,Math.round(h/8));
  const a=mk(sw,sh); a.x.drawImage(c,0,0,sw,sh);
  const d=a.x.getImageData(0,0,sw,sh), p=d.data;
  for (let i=0;i<p.length;i+=4){
    const l=(0.2126*p[i]+0.7152*p[i+1]+0.0722*p[i+2])/255;
    let m=Math.max(0,(l-0.72)/0.28); m*=m;
    p[i]=p[i+1]=p[i+2]=m*255; p[i+3]=255;
  }
  a.x.putImageData(d,0,0);
  const b=mk(sw,sh);
  b.x.filter=`blur(${Math.max(1.5,sw/70)}px)`; b.x.drawImage(a.c,0,0);
  b.x.filter=`blur(${Math.max(3,sw/28)}px)`; b.x.globalAlpha=0.6; b.x.drawImage(a.c,0,0);
  const u=mk(w,h); u.x.imageSmoothingQuality="high"; u.x.drawImage(b.c,0,0,w,h);
  const ud=u.x.getImageData(0,0,w,h).data, out=new Float32Array(w*h);
  for (let j=0;j<out.length;j++) out[j]=ud[j*4]/255;
  return out;
}

/* grain: gaussian-ish noise with clumps that scale with image size */
function noiseMap(w,h){
  const cell = Math.max(1, Math.round(Math.max(w,h)/1600));
  const gw=Math.ceil(w/cell), gh=Math.ceil(h/cell), rnd=mulberry(1873);
  const g=new Float32Array(gw*gh);
  for (let i=0;i<g.length;i++) g[i]=(rnd()+rnd()+rnd()-1.5)*1.15;
  if (cell===1) return g;
  const out=new Float32Array(w*h);
  for (let y=0;y<h;y++){ const gy=(y/cell|0)*gw; for (let x=0;x<w;x++) out[y*w+x]=g[gy+(x/cell|0)]*0.8+(rnd()-0.5)*0.5; }
  return out;
}

/* ---------- the developer ---------- */
function develop(P){
  const s=STOCKS[state.stock], src=P.data.data, w=P.w, h=P.h;
  const out=new ImageData(w,h), o=out.data, curve=buildCurve(s), M=s.m;
  const ev=Math.pow(2,state.ev), halo=state.halo/100*1.4, grain=state.grain/100*0.12;
  const warm=state.warmth/100*0.07, k=state.strength/100, vig=s.vig, mono=s.mono;
  const hr=1, hg=0.3, hb=0.1;
  const cx=w/2, cy=h/2, inv=1/(cx*cx+cy*cy);
  for (let y=0;y<h;y++){
    const dy=(y-cy)*(y-cy);
    for (let x=0;x<w;x++){
      const j=y*w+x, i=j*4;
      let r=S2L[src[i]]*ev, g=S2L[src[i+1]]*ev, b=S2L[src[i+2]]*ev;
      const hv=P.halo[j]*halo; r+=hv*hr; g+=hv*hg; b+=hv*hb;
      let R=M[0]*r+M[1]*g+M[2]*b, G=M[3]*r+M[4]*g+M[5]*b, B=M[6]*r+M[7]*g+M[8]*b;
      R=shoulder(R<0?0:R); G=shoulder(G<0?0:G); B=shoulder(B<0?0:B);
      R=L2S[(R*4095)|0]; G=L2S[(G*4095)|0]; B=L2S[(B*4095)|0];
      if (mono){ const l=R*mono[0]+G*mono[1]+B*mono[2]; R=G=B=l; }
      else { const l=0.2126*R+0.7152*G+0.0722*B; R=l+(R-l)*s.sat; G=l+(G-l)*s.sat; B=l+(B-l)*s.sat; }
      R=curve[(R<0?0:R>1?1:R)*1023|0]; G=curve[(G<0?0:G>1?1:G)*1023|0]; B=curve[(B<0?0:B>1?1:B)*1023|0];
      const l=0.2126*R+0.7152*G+0.0722*B, ws=(1-l)*(1-l), wh=l*l;
      R+=ws*s.sh[0]+wh*s.hi[0]+warm; G+=ws*s.sh[1]+wh*s.hi[1]+warm*0.25; B+=ws*s.sh[2]+wh*s.hi[2]-warm;
      const n=P.noise[j]*grain*(0.3+2.8*l*(1-l)); R+=n; G+=n; B+=n;
      const d=(x-cx)*(x-cx)+dy, v=1-vig*Math.pow(d*inv,1.5);
      R*=v; G*=v; B*=v;
      o[i]  =(src[i]  /255+(R-src[i]  /255)*k)*255;
      o[i+1]=(src[i+1]/255+(G-src[i+1]/255)*k)*255;
      o[i+2]=(src[i+2]/255+(B-src[i+2]/255)*k)*255;
      o[i+3]=255;
    }
  }
  return out;
}

/* ---------- sample scene (procedural dusk street) ---------- */
function sampleScene(){
  const W=1800,H=1200,{c,x}=mk(W,H), rnd=mulberry(42);
  const sky=x.createLinearGradient(0,0,0,H*0.72);
  sky.addColorStop(0,"#1b2747"); sky.addColorStop(0.45,"#6a4a6e"); sky.addColorStop(0.78,"#d9785a"); sky.addColorStop(1,"#f7c98a");
  x.fillStyle=sky; x.fillRect(0,0,W,H);
  const sun=x.createRadialGradient(1260,700,10,1260,700,260);
  sun.addColorStop(0,"rgba(255,250,235,1)"); sun.addColorStop(0.25,"rgba(255,226,170,.9)"); sun.addColorStop(1,"rgba(255,180,120,0)");
  x.fillStyle=sun; x.fillRect(0,0,W,H);
  x.fillStyle="#fffbf0"; x.beginPath(); x.arc(1260,700,58,0,7); x.fill();
  x.fillStyle="#4a3150"; x.beginPath(); x.moveTo(0,820);
  for (let px=0;px<=W;px+=20) x.lineTo(px,780+Math.sin(px/170)*30+Math.sin(px/53)*10);
  x.lineTo(W,H); x.lineTo(0,H); x.fill();
  let bx=0;
  while (bx<W){
    const bw=110+rnd()*170, bh=260+rnd()*380, top=H-bh;
    x.fillStyle=`rgb(${22+rnd()*12|0},${18+rnd()*10|0},${26+rnd()*12|0})`; x.fillRect(bx,top,bw,bh);
    for (let wy=top+24; wy<H-60; wy+=38) for (let wx=bx+14; wx<bx+bw-22; wx+=30)
      if (rnd()<0.32){ x.fillStyle=rnd()<0.7?"#ffd49a":"#bfe0ff"; x.fillRect(wx,wy,14,20); }
    bx+=bw+6;
  }
  x.fillStyle="#0c0a0d"; x.fillRect(430,640,10,H-640); x.fillRect(430,640,70,8);
  const bulb=x.createRadialGradient(500,660,2,500,660,90);
  bulb.addColorStop(0,"rgba(255,255,245,1)"); bulb.addColorStop(0.2,"rgba(255,220,160,.8)"); bulb.addColorStop(1,"rgba(255,200,140,0)");
  x.fillStyle=bulb; x.fillRect(380,560,240,220);
  const road=x.createLinearGradient(0,H-120,0,H); road.addColorStop(0,"#1a1418"); road.addColorStop(1,"#0a0809");
  x.fillStyle=road; x.fillRect(0,H-120,W,120);
  return c;
}

/* ---------- app wiring ---------- */
const view=$("#view"), vx=view.getContext("2d");
let src=sampleScene(), srcName="sample", P=null, developed=null, raf=0;

function previewEdge(){ const r=$("#stage").getBoundingClientRect(); return Math.min(1600, Math.max(900, Math.round(Math.max(r.width,r.height)*(window.devicePixelRatio||1)))); }
function rebuild(){ P=prepare(src, previewEdge()); view.width=P.w; view.height=P.h; $("#dimTag").textContent=`${ASPECTS[state.aspect][0]} · ${P.w}×${P.h} preview`; schedule(); }
function schedule(){ cancelAnimationFrame(raf); raf=requestAnimationFrame(()=>{ developed=develop(P); vx.putImageData(developed,0,0); }); }

function renderStocks(){
  const box=$("#stocks"); box.innerHTML="";
  STOCKS.forEach((s,i)=>{
    const b=document.createElement("button"); b.className="stock"; b.id="stock-"+i;
    b.setAttribute("aria-pressed", String(i===state.stock));
    b.innerHTML=`<span class="n"></span><span class="d"></span>`;
    b.querySelector(".n").textContent=s.name; b.querySelector(".d").textContent=s.d;
    b.onclick=()=>{ state.stock=i; state.grain=s.grain; state.halo=s.halo; renderStocks(); renderParams(); schedule(); };
    box.appendChild(b);
  });
  $("#ro-stock").innerHTML="<b></b>"; $("#ro-stock b").textContent=STOCKS[state.stock].name;
}
function renderParams(){
  const box=$("#params"); box.innerHTML="";
  PARAMS.forEach((p,i)=>{
    const b=document.createElement("button"); b.className="param"; b.id="param-"+p.k;
    b.setAttribute("aria-pressed", String(i===activeParam));
    b.innerHTML=`${p.label}<span>${p.fmt(state[p.k])}</span>`;
    b.onclick=()=>{ activeParam=i; renderParams(); };
    box.appendChild(b);
  });
  const p=PARAMS[activeParam], sl=$("#slider");
  sl.min=p.min; sl.max=p.max; sl.step=p.step; sl.value=state[p.k]; sl.setAttribute("aria-label",p.label);
  $("#ro-ev").textContent=PARAMS[4].fmt(state.ev)+" EV";
}
$("#slider").addEventListener("input", e=>{
  const p=PARAMS[activeParam]; state[p.k]=parseFloat(e.target.value);
  document.querySelector(`#param-${p.k} span`).textContent=p.fmt(state[p.k]);
  $("#ro-ev").textContent=PARAMS[4].fmt(state.ev)+" EV";
  schedule();
});
$("#aspect").onclick=()=>{ state.aspect=(state.aspect+1)%ASPECTS.length; $("#aspect").textContent=ASPECTS[state.aspect][0]; rebuild(); };

const cmp=$("#compare");
const showOrig=e=>{ e.preventDefault(); if(P) vx.putImageData(P.data,0,0); cmp.textContent="Original"; };
const showDev=()=>{ if(developed) vx.putImageData(developed,0,0); cmp.textContent="Hold: original"; };
cmp.addEventListener("pointerdown",showOrig); ["pointerup","pointerleave","pointercancel"].forEach(t=>cmp.addEventListener(t,showDev));

function loadFile(file){
  if(!file) return;
  const url=URL.createObjectURL(file), img=new Image();
  $("#busy").hidden=false;
  img.onload=()=>{ src=img; srcName=(file.name||"photo").replace(/\.[^.]+$/,""); $("#srcTag").textContent="Your photo"; rebuild(); $("#busy").hidden=true; };
  img.onerror=()=>{ $("#busy").hidden=true; toast("That file isn't a photo this browser can open. Try a JPEG or PNG."); };
  img.src=url;
}
$("#cam").addEventListener("change",e=>{ loadFile(e.target.files[0]); e.target.value=""; });
$("#pick").addEventListener("change",e=>{ loadFile(e.target.files[0]); e.target.value=""; });

function toast(msg){ const t=$("#toast"); t.textContent=msg; t.hidden=false; clearTimeout(toast.t); toast.t=setTimeout(()=>t.hidden=true,2800); }

$("#save").onclick=async()=>{
  $("#busy").hidden=false;
  await new Promise(r=>setTimeout(r,30));
  let blob;
  try{
    const F=prepare(src,3200); F.x.putImageData(develop(F),0,0);
    blob=await new Promise(r=>F.c.toBlob(r,"image/jpeg",0.93));
  } finally { $("#busy").hidden=true; }
  if(!blob){ toast("Couldn't develop the full-size photo. Try the 3:2 frame or a smaller photo."); return; }
  const stamp=new Date().toISOString().slice(0,16).replace(/[-:T]/g,"");
  const filename=`gatelight_${STOCKS[state.stock].name.replace(/\s+/g,"-").toLowerCase()}_${stamp}.jpg`;
  let dl=null;
  try{ dl = window.claude && window.claude.use ? await window.claude.use("downloads") : null; }catch(_){ dl=null; }
  if(dl){
    try{ await dl.save({filename, data:blob}); toast("Saved "+filename); return; }
    catch(e){ if(e && e.code==="declined"){ toast("Save cancelled"); return; } }
  }
  $("#sheetImg").src=URL.createObjectURL(blob); $("#sheet").hidden=false;
};
$("#sheetClose").onclick=()=>{ $("#sheet").hidden=true; };

let rt; window.addEventListener("resize",()=>{ clearTimeout(rt); rt=setTimeout(rebuild,200); });
renderStocks(); renderParams(); rebuild();
})();
</script>
